[tool.poetry]
name = "django-debug-toolbar-mongo"
version = "1.0.22"  # set by antonio-py-dynamic-version
description = "MongoDB panel for Django Debug Toolbar"
authors = ["Antonio <mr.antonsilin@gmail.com>"]
readme = "README.md"
packages = [{include = "debug_toolbar_mongo"}]

[tool.poetry.dependencies]
python = "^3.10"
Django = "*"
pymongo = ">=4.7"
django-debug-toolbar = "*"
tqdm = "*"


[tool.poetry.group.dev.dependencies]
antonio-py-dynamic-version = {git = "https://bitbucket.org/asilin/antonio-py-dynamic-version.git"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
